[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "snapscope"
dynamic = ["version"]
description = "Audit the snaps on an Ubuntu machine: security, disk usage and pending refreshes"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Mueed Hyder" }]
keywords = ["snap", "snapd", "ubuntu", "security", "audit"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = []  # standard library only

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
snapscope = "snapscope.cli:main"

[tool.setuptools.dynamic]
version = { attr = "snapscope.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]
